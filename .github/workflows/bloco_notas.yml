name: bloco_notas

on:
  push:
    paths:
      - "apps/mobile/bloco_notas/**"
      - ".github/workflows/bloco_notas.yml"
  pull_request:
    paths:
      - "apps/mobile/bloco_notas/**"
      - ".github/workflows/bloco_notas.yml"
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/bloco_notas
    steps:
      - uses: actions/checkout@v4

      # Versão fixada igual à usada localmente (Dart 3.13.0)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  compilar_apk:
    needs: testar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/bloco_notas
    steps:
      - uses: actions/checkout@v4

      # Java 21, igual ao usado localmente (Gradle 9.3.1 e AGP 9.1.0 exigem 17 ou superior)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: bloco_notas-debug-apk
          path: apps/mobile/bloco_notas/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      # Envia o APK para o Firebase App Distribution (só em push para main)
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUP }}
          file: apps/mobile/bloco_notas/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Build ${{ github.run_number }} - commit ${{ github.sha }}"
